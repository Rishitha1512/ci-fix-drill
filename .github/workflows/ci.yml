name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci   # FIX: use npm ci for reproducible installs

  test:
    runs-on: ubuntu-latest
    needs: install   # FIX: ensure install job runs first
    steps:
      - uses: actions/checkout@v4   # FIX: checkout repo so package.json exists
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci   # FIX: install dependencies in this job
      - name: Run tests
        run: npm test
